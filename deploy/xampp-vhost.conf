# XAMPP Apache vhost — proxy to Django (Gunicorn / runserver on port 8000)
#
# 1. Enable these modules in C:\xampp8\apache\conf\httpd.conf:
#    LoadModule proxy_module modules/mod_proxy.so
#    LoadModule proxy_http_module modules/mod_proxy_http.so
#    LoadModule rewrite_module modules/mod_rewrite.so
#
# 2. Include this file from httpd-vhosts.conf, OR paste the VirtualHost below.
# 3. Start Django first:  start-host.bat
# 4. Restart Apache.

<VirtualHost *:80>
    ServerName vaaradhi.org.in
    ServerAlias www.vaaradhi.org.in localhost 127.0.0.1
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    ErrorLog "logs/vaaradhi-error.log"
    CustomLog "logs/vaaradhi-access.log" combined
</VirtualHost>
